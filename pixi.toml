[workspace]
    authors   = ["CarbonPlan <hello@carbonplan.org>"]
    channels  = ["conda-forge"]
    name      = "srm-downscaling-data-utils"
    platforms = ["linux-64", "osx-arm64", "win-64"]
    version   = "0.1.0"

[tasks]

[dependencies]
    cftime     = ">=1.6,<2"
    dask       = ">=2026.3.0,<2027"
    flox       = ">=0.9,<1"
    geopandas  = ">=1.0,<2"
    icechunk   = ">=2.0.5,<3"
    ipython    = ">=9.13.0,<10"
    jupyterlab = ">=4.5.7,<5"
    matplotlib = ">=3.10.9,<4"
    polars     = ">=1.41.0,<2"
    pooch      = ">=1.8,<2"
    rasterio   = ">=1.5.0,<2"
    s3fs       = ">=2026.4.0,<2027"
    xarray     = ">=2026.4.0,<2027"
    xproj      = ">=0.2.1,<0.3"
    zarr       = ">=3.2.1,<4"

[pypi-dependencies]
    rasterix  = ">=0.2.1, <0.3"
    rusterize = ">=0.8.0, <0.9"

# Optional environment for the global benchmark in notebooks/compute-resources.ipynb. Not installed by
# default: `pixi install` is unchanged, only `pixi run -e cloud ...` pulls this in.
# Note: coiled is Elastic-2.0 licensed, unlike the MIT code in this repo.
[feature.cloud.dependencies]
    coiled = ">=1.135,<2"
    # Pinned to match the default environment. icechunk is a compiled extension,
    # so builds are Python-version specific, and 2.2.0 has no py3.14 linux-64
    # build -- which breaks Coiled package-sync when mirroring this env onto a
    # Linux VM. 2.0.5 does have one.
    icechunk = "==2.0.5"

[environments]
    cloud = { features = ["cloud"], solve-group = "default" }
