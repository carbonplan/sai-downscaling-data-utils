name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # locked: true fails if pixi.lock no longer matches pixi.toml.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true

      - name: the download tool starts and prints its options
        run: pixi run download --help

      - name: every documented download command still runs
        run: pixi run python scripts/check_docs_commands.py

  terms:
    name: terms of data access in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The canonical copy lives in the pipeline repo. Both repos are public, so no token is
      # needed. Edit the canonical file there and copy it here, never the other way round.
      - name: the local copy matches the canonical one
        run: |
          curl -fsSL -o /tmp/TERMS_OF_DATA_ACCESS \
            https://raw.githubusercontent.com/carbonplan/sai-downscaling/main/TERMS_OF_DATA_ACCESS
          diff -u /tmp/TERMS_OF_DATA_ACCESS TERMS_OF_DATA_ACCESS
